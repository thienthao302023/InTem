<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tem 35x22 - RawBT</title>
  <style>
    @page { size: 35mm 22mm; margin: 0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      gap: 15px;
    }
    #printArea {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .row {
      display: flex;
      width: 70mm;
    }
    .label {
      width: 35mm;
      height: 22mm;
      padding: 0.5mm 2.4mm 1mm 0mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: white;
      overflow: hidden;
      border: 0.3mm solid #ccc;
    }
    .label.empty {
      background: transparent;
      border: none;
    }
    @media print {
      body { background: white; margin: 0; padding: 0; }
      .no-print { display: none !important; }
      .label { border: none !important; }
      .row { page-break-inside: avoid; }
    }
    .top-text {
      font-size: 4pt;
      font-weight: bold;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.2px;
      line-height: 1.2;
      margin-bottom: 0mm;
    }
    .middle {
      display: flex;
      align-items: center;
      gap: 1.2mm;
      flex: 1;
      min-height: 0;
      margin-top: -4.5mm;
    }
    .qrcode {
      width: 10.5mm;
      height: 10.5mm;
      flex-shrink: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .qrcode img,
    .qrcode canvas {
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated !important;
      image-rendering: crisp-edges !important;
    }
    .barcode-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      height: 100%;
    }
    .barcode {
      width: 90%;
      max-height: 7mm;
    }
    .barcode-number {
      font-size: 5.5pt;
      font-weight: 600;
      margin-top: 0.2mm;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
    /* ===== TÊN HÀNG - HỖ TRỢ 2 DÒNG ===== */
    .bottom-text {
      font-family: "Bahnschrift Condensed", "Bahnschrift", "Arial Narrow", Arial, sans-serif;
      font-weight: 700;
      text-align: center;
      overflow: hidden;
      line-height: 1.1;
      font-size: 8.5pt;
      padding-top: 0.3mm;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      white-space: normal;
      word-break: break-word;
      max-height: 6.8mm;
    }
    .button-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      font-size: 15px;
      padding: 12px 18px;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    #sharePdfBtn { background: #e91e63; }
    #saveImageBtn { background: #16a34a; }
  </style>
</head>
<body>
  <div id="printArea"></div>
  <div class="button-container no-print">
    <button id="sharePdfBtn">Chia sẻ PDF</button>
    <button id="saveImageBtn">Lưu ảnh</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    function createLabel(top, barcode, qr, bottom, id) {
      const div = document.createElement('div');
      div.className = 'label';
      const bottomUpper = (bottom || '').toUpperCase();
      div.innerHTML = `
        <div class="top-text">${top}</div>
        <div class="middle">
          <div class="qrcode" id="qr_${id}"></div>
          <div class="barcode-area">
            <svg class="barcode" id="bc_${id}"></svg>
            <div class="barcode-number">${barcode}</div>
          </div>
        </div>
        <div class="bottom-text" id="bottom_${id}">${bottomUpper}</div>
      `;
      return div;
    }
    // Tự động giảm cỡ chữ (hỗ trợ tối đa 2 dòng)
    function fitText(el, maxFontPt = 8.8, minFontPt = 5.5) {
      if (!el) return;
      let fontSize = maxFontPt;
      el.style.fontSize = fontSize + 'pt';
      el.style.whiteSpace = 'normal';
      el.style.display = '-webkit-box';
      el.style.webkitLineClamp = '2';
      el.style.webkitBoxOrient = 'vertical';
      el.style.overflow = 'hidden';
      while (fontSize > minFontPt && (el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth)) {
        fontSize -= 0.25;
        el.style.fontSize = fontSize + 'pt';
      }
    }
    function veTem() {
      const params = new URLSearchParams(window.location.search);
      const top = params.get('top') || 'PHU TUNG THIENTHAOCHBL';
      const barcode1 = params.get('barcode') || '0000000000000';
      const qr1 = params.get('qr') || barcode1;
      const bottom1 = params.get('bottom') || '---';
      const qty1 = parseInt(params.get('qty1') || '1');
      const barcode2 = params.get('barcode2');
      const qr2 = params.get('qr2') || barcode2;
      const bottom2 = params.get('bottom2') || '---';
      const qty2 = parseInt(params.get('qty2') || '0');
      const printArea = document.getElementById('printArea');
      printArea.innerHTML = '';
      let labels = [];
      for (let i = 0; i < qty1; i++) {
        labels.push({ top, barcode: barcode1, qr: qr1, bottom: bottom1 });
      }
      if (barcode2 && qty2 > 0) {
        for (let i = 0; i < qty2; i++) {
          labels.push({ top, barcode: barcode2, qr: qr2, bottom: bottom2 });
        }
      }
      for (let i = 0; i < labels.length; i += 2) {
        const row = document.createElement('div');
        row.className = 'row';
        const left = createLabel(labels[i].top, labels[i].barcode, labels[i].qr, labels[i].bottom, i);
        row.appendChild(left);
        if (i + 1 < labels.length) {
          const right = createLabel(labels[i+1].top, labels[i+1].barcode, labels[i+1].qr, labels[i+1].bottom, i+1);
          row.appendChild(right);
        } else {
          const empty = document.createElement('div');
          empty.className = 'label empty';
          row.appendChild(empty);
        }
        printArea.appendChild(row);
      }
      setTimeout(() => {
        labels.forEach((l, idx) => {
          JsBarcode(`#bc_${idx}`, l.barcode, {
            format: "CODE128",
            width: 0.9,
            height: 26,
            displayValue: false,
            margin: 0
          });
          new QRCode(document.getElementById(`qr_${idx}`), {
            text: l.qr,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
          fitText(document.getElementById(`bottom_${idx}`), 8.8, 5.5);
        });
      }, 100);
      const style = document.createElement('style');
      style.textContent = `@page { size: 70mm 22mm; margin: 0; }`;
      document.head.appendChild(style);
    }
    window.addEventListener('load', () => setTimeout(veTem, 120));
    async function sharePdf() {
      try {
        const rows = document.querySelectorAll('#printArea .row');
        if (rows.length === 0) {
          alert('Không có tem để in');
          return;
        }
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: 'landscape',
          unit: 'mm',
          format: [70, 22]
        });
        for (let i = 0; i < rows.length; i++) {
          if (i > 0) pdf.addPage([70, 22], 'landscape');
          const canvas = await html2canvas(rows[i], {
            scale: 8,
            backgroundColor: "#ffffff",
            useCORS: true,
            logging: false,
            allowTaint: true
          });
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = false;
          const imgData = canvas.toDataURL('image/png', 1.0);
          pdf.addImage(imgData, 'PNG', 0, 0, 70, 22, undefined, 'NONE');
        }
        const fileName = `tem_${Date.now()}.pdf`;
        const pdfBlob = pdf.output('blob');
        const file = new File([pdfBlob], fileName, { type: 'application/pdf' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Tem PDF' });
        } else {
          pdf.save(fileName);
        }
      } catch (e) {
        console.error(e);
        alert('Không thể tạo PDF: ' + e.message);
      }
    }
    async function saveImage() {
      try {
        const printArea = document.getElementById('printArea');
        if (!printArea.children.length) {
          alert('Không có tem để lưu');
          return;
        }
        const canvas = await html2canvas(printArea, {
          scale: 8,
          backgroundColor: "#ffffff",
          useCORS: true,
          logging: false,
          allowTaint: true
        });
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        const imgData = canvas.toDataURL('image/png', 1.0);
        const link = document.createElement('a');
        link.download = `tem_${Date.now()}.png`;
        link.href = imgData;
        link.click();
      } catch (e) {
        console.error(e);
        alert('Không thể lưu ảnh: ' + e.message);
      }
    }
    document.getElementById("sharePdfBtn").addEventListener("click", sharePdf);
    document.getElementById("saveImageBtn").addEventListener("click", saveImage);
  </script>
</body>
</html>
