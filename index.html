<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tem 35x22</title>
  <style>
    @page {
      size: 35mm 22mm;
      margin: 0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .label {
      width: 35mm;
      height: 22mm;
      padding: 1mm 1.2mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: white;
      overflow: hidden;
    }
    @media print {
      body { background: white; }
      .no-print { display: none !important; }
    }
    .top-text {
      font-size: 5pt;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .middle {
      display: flex;
      align-items: center;
      gap: 1.2mm;
      flex: 1;
    }
    #qrcode {
      width: 10.5mm;
      height: 10.5mm;
      flex-shrink: 0;
    }
    .barcode-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }
    #barcode {
      width: 100%;
      max-height: 7.5mm;
    }
    .barcode-number {
      font-size: 5.5pt;
      font-weight: 600;
      margin-top: 0.2mm;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .bottom-text {
      font-family: "Bahnschrift Condensed", "Bahnschrift", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
      font-size: 8.5pt;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .print-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 28px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="label">
    <div class="top-text" id="top">PHU TUNG THIENTHAOCHBL</div>
    
    <div class="middle">
      <div id="qrcode"></div>
      <div class="barcode-area">
        <svg id="barcode"></svg>
        <div class="barcode-number" id="num">---</div>
      </div>
    </div>
    
    <div class="bottom-text" id="bottom">---</div>
  </div>

  <button class="print-btn no-print" onclick="window.print()">In tem ngay</button>

  <!-- Thư viện ổn định -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    function veTem() {
      const params = new URLSearchParams(window.location.search);

      const top     = params.get('top')     || 'PHU TUNG THIENTHAOCHBL';
      const barcode = params.get('barcode') || '0000000000000';
      const qr      = params.get('qr')      || barcode;
      const bottom  = params.get('bottom')  || '---';

      document.getElementById('top').textContent = top;
      document.getElementById('num').textContent = barcode;
      document.getElementById('bottom').textContent = bottom;

      // Vẽ barcode
      JsBarcode("#barcode", barcode, {
        format: "CODE128",
        width: 0.9,
        height: 26,
        displayValue: false,
        margin: 0
      });

      // Vẽ QR (thư viện qrcodejs)
      document.getElementById('qrcode').innerHTML = '';
      new QRCode(document.getElementById('qrcode'), {
        text: qr,
        width: 40,
        height: 40,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    // Đợi thư viện load
    window.addEventListener('load', function() {
      setTimeout(veTem, 100);
    });
  </script>
</body>
</html>
