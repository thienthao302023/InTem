<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tem 35x22</title>
  <style>
    @page {
      size: 70mm 22mm;
      margin: 0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .sheet {
      display: flex;
      width: 70mm;
      height: 22mm;
      background: white;
    }
    .label {
      width: 35mm;
      height: 22mm;
      border: 0.3mm solid #ccc;
      padding: 1.2mm 1.5mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    @media print {
      body { background: white; }
      .label { border: none; }
      .no-print { display: none !important; }
    }
    .top-text {
      font-size: 5.5pt;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .middle {
      display: flex;
      align-items: center;
      gap: 1.5mm;
      flex: 1;
    }
    .barcode-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .barcode-number {
      font-size: 6pt;
      font-weight: 600;
      margin-top: 0.3mm;
    }
    .bottom-text {
      font-size: 9pt;
      font-weight: 900;
      text-align: center;
    }
    .print-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 28px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="sheet">
    <!-- TEM 1 -->
    <div class="label">
      <div class="top-text" id="top1">PHU TUNG THIENTHAOCHBL</div>
      <div class="middle">
        <canvas id="qr1" width="42" height="42"></canvas>
        <div class="barcode-area">
          <svg id="barcode1"></svg>
          <div class="barcode-number" id="num1">---</div>
        </div>
      </div>
      <div class="bottom-text" id="bottom1">---</div>
    </div>

    <!-- TEM 2 -->
    <div class="label">
      <div class="top-text" id="top2">PHU TUNG THIENTHAOCHBL</div>
      <div class="middle">
        <canvas id="qr2" width="42" height="42"></canvas>
        <div class="barcode-area">
          <svg id="barcode2"></svg>
          <div class="barcode-number" id="num2">---</div>
        </div>
      </div>
      <div class="bottom-text" id="bottom2">---</div>
    </div>
  </div>

  <button class="print-btn no-print" onclick="window.print()">In tem ngay</button>

  <!-- Load thư viện trước -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

  <script>
    // Chờ thư viện load xong rồi mới chạy
    function veTem() {
      const params = new URLSearchParams(window.location.search);

      const top     = params.get('top')     || 'PHU TUNG THIENTHAOCHBL';
      const barcode = params.get('barcode') || '0000000000000';
      const qr      = params.get('qr')      || barcode;
      const bottom  = params.get('bottom')  || '---';

      // Tem 1
      document.getElementById('top1').textContent = top;
      document.getElementById('num1').textContent = barcode;
      document.getElementById('bottom1').textContent = bottom;

      JsBarcode("#barcode1", barcode, {
        format: "CODE128",
        width: 1.1,
        height: 28,
        displayValue: false,
        margin: 0
      });

      QRCode.toCanvas(document.getElementById('qr1'), qr, {
        width: 42,
        margin: 0,
        errorCorrectionLevel: 'M'
      });

      // Tem 2 (giống tem 1)
      document.getElementById('top2').textContent = top;
      document.getElementById('num2').textContent = barcode;
      document.getElementById('bottom2').textContent = bottom;

      JsBarcode("#barcode2", barcode, {
        format: "CODE128",
        width: 1.1,
        height: 28,
        displayValue: false,
        margin: 0
      });

      QRCode.toCanvas(document.getElementById('qr2'), qr, {
        width: 42,
        margin: 0,
        errorCorrectionLevel: 'M'
      });
    }

    // Đảm bảo thư viện đã sẵn sàng
    if (typeof JsBarcode !== 'undefined' && typeof QRCode !== 'undefined') {
      veTem();
    } else {
      window.addEventListener('load', veTem);
    }
  </script>
</body>
</html>
