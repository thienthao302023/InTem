<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tem 35x22</title>
  <style>
    @page { size: 35mm 22mm; margin: 0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      gap: 15px;
    }
    #printArea {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .row {
      display: flex;
      width: 70mm;
    }
    .label {
      width: 35mm;
      height: 22mm;
      padding: 1mm 1.2mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: white;
      overflow: hidden;
      border: 0.3mm solid #ccc;
    }
    .label.empty {
      background: transparent;
      border: none;
    }
    @media print {
      body { background: white; margin: 0; padding: 0; }
      .no-print { display: none !important; }
      .label { border: none !important; }
      .row { page-break-inside: avoid; }
    }
    .top-text {
      font-size: 5pt;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .middle {
      display: flex;
      align-items: center;
      gap: 1.2mm;
      flex: 1;
    }
    .qrcode {
      width: 10.5mm;
      height: 10.5mm;
      flex-shrink: 0;
    }
    .barcode-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }
    .barcode { width: 100%; max-height: 7.5mm; }
    .barcode-number {
      font-size: 5.5pt;
      font-weight: 600;
      margin-top: 0.2mm;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .bottom-text {
      font-family: "Bahnschrift Condensed", "Bahnschrift", "Arial Narrow", Arial, sans-serif;
      font-size: 8.5pt;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .button-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      font-size: 16px;
      padding: 10px 18px;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #sharePdfBtn { background: #e91e63; }
    #printBtn { background: #2563eb; }
  </style>
</head>
<body>

  <div id="printArea"></div>

  <div class="button-container no-print">
    <button id="sharePdfBtn">Chia sẻ PDF</button>
    <button id="printBtn" onclick="window.print()">In tem ngay</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    function createLabel(top, barcode, qr, bottom, id) {
      const div = document.createElement('div');
      div.className = 'label';
      div.innerHTML = `
        <div class="top-text">${top}</div>
        <div class="middle">
          <div class="qrcode" id="qr_${id}"></div>
          <div class="barcode-area">
            <svg class="barcode" id="bc_${id}"></svg>
            <div class="barcode-number">${barcode}</div>
          </div>
        </div>
        <div class="bottom-text">${bottom}</div>
      `;
      return div;
    }

    function veTem() {
      const params = new URLSearchParams(window.location.search);
      const top = params.get('top') || 'PHU TUNG THIENTHAOCHBL';

      // SP1
      const barcode1 = params.get('barcode') || '0000000000000';
      const qr1 = params.get('qr') || barcode1;
      const bottom1 = params.get('bottom') || '---';
      const qty1 = parseInt(params.get('qty1') || '1');

      // SP2 (tùy chọn)
      const barcode2 = params.get('barcode2');
      const qr2 = params.get('qr2') || barcode2;
      const bottom2 = params.get('bottom2') || '---';
      const qty2 = parseInt(params.get('qty2') || '0');

      const printArea = document.getElementById('printArea');
      printArea.innerHTML = '';

      // Tạo danh sách tem
      let labels = [];
      for (let i = 0; i < qty1; i++) {
        labels.push({ top, barcode: barcode1, qr: qr1, bottom: bottom1 });
      }
      if (barcode2 && qty2 > 0) {
        for (let i = 0; i < qty2; i++) {
          labels.push({ top, barcode: barcode2, qr: qr2, bottom: bottom2 });
        }
      }

      // Ghép thành hàng đôi (2 tem / hàng)
      for (let i = 0; i < labels.length; i += 2) {
        const row = document.createElement('div');
        row.className = 'row';

        // Tem trái
        const left = createLabel(labels[i].top, labels[i].barcode, labels[i].qr, labels[i].bottom, i);
        row.appendChild(left);

        // Tem phải
        if (i + 1 < labels.length) {
          const right = createLabel(labels[i+1].top, labels[i+1].barcode, labels[i+1].qr, labels[i+1].bottom, i+1);
          row.appendChild(right);
        } else {
          // Số lẻ → để trống bên phải (không phí tem nếu máy in đúng)
          const empty = document.createElement('div');
          empty.className = 'label empty';
          row.appendChild(empty);
        }

        printArea.appendChild(row);
      }

      // Vẽ barcode + QR
      setTimeout(() => {
        labels.forEach((l, idx) => {
          JsBarcode(`#bc_${idx}`, l.barcode, {
            format: "CODE128",
            width: 0.9,
            height: 26,
            displayValue: false,
            margin: 0
          });
          new QRCode(document.getElementById(`qr_${idx}`), {
            text: l.qr,
            width: 40,
            height: 40,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
          });
        });
      }, 100);

      // Đổi page size
      const style = document.createElement('style');
      style.textContent = `@page { size: 70mm 22mm; margin: 0; }`;
      document.head.appendChild(style);
    }

    window.addEventListener('load', () => setTimeout(veTem, 150));

    // Chia sẻ PDF
    async function sharePdf() {
      try {
        const element = document.getElementById("printArea");
        const canvas = await html2canvas(element, {
          scale: 3,
          backgroundColor: "#ffffff"
        });
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;

        // Tính số trang (mỗi hàng 1 trang)
        const rows = element.querySelectorAll('.row').length;
        const pdf = new jsPDF({
          orientation: 'landscape',
          unit: 'mm',
          format: [70, 22]
        });

        // Vì html2canvas lấy cả khối, ta cắt theo từng hàng sẽ phức tạp.
        // Cách đơn giản: tạo PDF nhiều trang bằng cách in từng hàng
        // (ở đây dùng cách đơn giản nhất - 1 ảnh lớn, máy in sẽ cắt)

        pdf.addImage(imgData, 'PNG', 0, 0, 70, 22 * rows);
        // Lưu ý: một số máy in/RawBT xử lý tốt hơn nếu mỗi trang 1 hàng.
        // Nếu cần chính xác hơn bảo mình chỉnh tiếp.

        const fileName = `tem_${Date.now()}.pdf`;
        const pdfBlob = pdf.output('blob');
        const file = new File([pdfBlob], fileName, { type: 'application/pdf' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Tem' });
        } else {
          pdf.save(fileName);
        }
      } catch (e) {
        console.error(e);
        alert('Không thể chia sẻ PDF');
      }
    }

    document.getElementById("sharePdfBtn").addEventListener("click", sharePdf);
  </script>
</body>
</html>
